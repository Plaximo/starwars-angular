<div class="max-w-7xl mx-auto px-4 pt-6">
  <!-- Top Galactic Navigation Tabs -->
  <nav aria-label="Main Navigation" class="flex flex-col sm:flex-row items-center justify-between gap-4 p-3 rounded-2xl bg-slate-900/90 border border-slate-800 shadow-xl backdrop-blur-md mb-2">
    <!-- Holocron Brand -->
    <div class="flex items-center gap-3 px-2">
      <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-amber-400 to-yellow-600 flex items-center justify-center text-slate-950 font-black shadow-lg shadow-amber-500/20 text-base">
        ⚡
      </div>
      <div>
        <span class="text-[10px] tracking-widest uppercase font-semibold text-amber-400 block">{{ i18n.t().brandHolocron }}</span>
        <span class="text-sm font-bold text-slate-100">{{ i18n.t().brandTitle }}</span>
      </div>
    </div>

    <!-- Actions & Segmented Tab Switcher -->
    <div class="flex flex-wrap items-center gap-2.5 w-full sm:w-auto justify-end">
      <!-- Language Switcher Toggle -->
      <button
        type="button"
        (click)="i18n.toggleLanguage()"
        class="inline-flex items-center gap-1.5 px-2.5 py-2 rounded-xl text-xs font-semibold bg-slate-950 border border-slate-800 hover:border-amber-400/50 text-slate-300 hover:text-white transition-all cursor-pointer shadow-sm"
        [title]="i18n.t().switchLanguageTooltip"
      >
        <span>{{ i18n.isGerman() ? '🇩🇪' : '🇬🇧' }}</span>
        <span class="font-bold text-amber-300">{{ i18n.lang().toUpperCase() }}</span>
      </button>

      <!-- Dev Network Simulation Toggle (Showcase for Optimistic Updates with Rollback) -->
      <button
        type="button"
        (click)="simulation.toggleSimulateError()"
        [class.bg-rose-500/20]="simulation.simulateError()"
        [class.border-rose-500/50]="simulation.simulateError()"
        [class.text-rose-300]="simulation.simulateError()"
        [class.bg-slate-950]="!simulation.simulateError()"
        [class.border-slate-800]="!simulation.simulateError()"
        [class.text-slate-400]="!simulation.simulateError()"
        class="inline-flex items-center gap-2 px-3 py-2 rounded-xl text-xs font-medium border hover:border-amber-400/40 transition-all cursor-pointer shadow-sm"
        [title]="i18n.t().simErrorTooltip"
      >
        <span [class.animate-pulse]="simulation.simulateError()">⚡</span>
        <span class="text-[11px] font-semibold">{{ i18n.t().simErrorLabel }}</span>
        <span
          [class.bg-rose-500]="simulation.simulateError()"
          [class.text-white]="simulation.simulateError()"
          [class.bg-slate-800]="!simulation.simulateError()"
          [class.text-slate-400]="!simulation.simulateError()"
          class="px-1.5 py-0.5 rounded text-[10px] font-bold"
        >
          {{ simulation.simulateError() ? 'ON' : 'OFF' }}
        </span>
      </button>

      <!-- Online / Offline Mode Showcase Toggle -->
      <button
        type="button"
        (click)="onlineStatus.toggleMockOffline()"
        [class.bg-amber-500/20]="onlineStatus.isOffline()"
        [class.border-amber-500/50]="onlineStatus.isOffline()"
        [class.text-amber-300]="onlineStatus.isOffline()"
        [class.bg-slate-950]="!onlineStatus.isOffline()"
        [class.border-slate-800]="!onlineStatus.isOffline()"
        [class.text-slate-400]="!onlineStatus.isOffline()"
        class="inline-flex items-center gap-2 px-3 py-2 rounded-xl text-xs font-medium border hover:border-amber-400/40 transition-all cursor-pointer shadow-sm"
        [title]="i18n.t().offlineModeTooltip"
      >
        <span>{{ onlineStatus.isOffline() ? '📡' : '🌐' }}</span>
        <span class="text-[11px] font-semibold hidden sm:inline">{{ i18n.t().modeLabel }}</span>
        <span
          [class.bg-amber-400]="onlineStatus.isOffline()"
          [class.text-slate-950]="onlineStatus.isOffline()"
          [class.bg-emerald-500/20]="!onlineStatus.isOffline()"
          [class.text-emerald-400]="!onlineStatus.isOffline()"
          class="px-1.5 py-0.5 rounded text-[10px] font-bold"
        >
          {{ onlineStatus.isOffline() ? i18n.t().modeOffline : i18n.t().modeOnline }}
        </span>
      </button>

      <!-- Segmented Tab Switcher -->
      <div class="flex items-center p-1 bg-slate-950 rounded-xl border border-slate-800 w-full sm:w-auto">
      <button
        type="button"
        (click)="setTab('characters')"
        [class.bg-gradient-to-r]="activeTab() === 'characters'"
        [class.from-amber-400]="activeTab() === 'characters'"
        [class.to-yellow-500]="activeTab() === 'characters'"
        [class.text-slate-950]="activeTab() === 'characters'"
        [class.font-bold]="activeTab() === 'characters'"
        [class.shadow-md]="activeTab() === 'characters'"
        [class.text-slate-400]="activeTab() !== 'characters'"
        [class.hover:text-white]="activeTab() !== 'characters'"
        class="flex-1 sm:flex-none flex items-center justify-center gap-2 px-5 py-2 rounded-lg text-xs font-medium transition-all duration-200 cursor-pointer"
      >
        <span>👥</span>
        <span>{{ i18n.t().tabCharacters }}</span>
        <span
          [class.bg-slate-950]="activeTab() === 'characters'"
          [class.text-amber-300]="activeTab() === 'characters'"
          [class.bg-slate-800]="activeTab() !== 'characters'"
          [class.text-slate-400]="activeTab() !== 'characters'"
          class="px-1.5 py-0.5 rounded text-[10px] font-semibold"
        >
          {{ peopleVm.totalCount() }}
        </span>
      </button>

      <button
        type="button"
        (click)="setTab('planets')"
        [class.bg-gradient-to-r]="activeTab() === 'planets'"
        [class.from-amber-400]="activeTab() === 'planets'"
        [class.to-yellow-500]="activeTab() === 'planets'"
        [class.text-slate-950]="activeTab() === 'planets'"
        [class.font-bold]="activeTab() === 'planets'"
        [class.shadow-md]="activeTab() === 'planets'"
        [class.text-slate-400]="activeTab() !== 'planets'"
        [class.hover:text-white]="activeTab() !== 'planets'"
        class="flex-1 sm:flex-none flex items-center justify-center gap-2 px-5 py-2 rounded-lg text-xs font-medium transition-all duration-200 cursor-pointer"
      >
        <span>🪐</span>
        <span>{{ i18n.t().tabPlanets }}</span>
        <span
          [class.bg-slate-950]="activeTab() === 'planets'"
          [class.text-amber-300]="activeTab() === 'planets'"
          [class.bg-slate-800]="activeTab() !== 'planets'"
          [class.text-slate-400]="activeTab() !== 'planets'"
          class="px-1.5 py-0.5 rounded text-[10px] font-semibold"
        >
          {{ planetsVm.totalCount() }}
        </span>
      </button>
    </div>
  </div>
</nav>

  <!-- Offline Cache Banner Notification -->
  @if (onlineStatus.isOffline()) {
    <div class="mt-3 p-3 rounded-xl bg-amber-500/10 border border-amber-500/30 flex items-center justify-between text-amber-300 text-xs animate-fade-in shadow-lg">
      <div class="flex items-center gap-2.5">
        <span class="text-base animate-pulse">📡</span>
        <div>
          <span class="font-bold">{{ i18n.t().offlineModeActiveLabel }}</span>
          <span class="text-amber-200/80 ml-1">{{ i18n.t().modeOfflineBanner }}</span>
        </div>
      </div>
      <button
        type="button"
        (click)="onlineStatus.toggleMockOffline()"
        class="px-2.5 py-1 rounded bg-amber-400/20 hover:bg-amber-400/30 border border-amber-400/40 text-amber-200 text-[11px] font-semibold transition cursor-pointer"
      >
        {{ i18n.t().reconnect }}
      </button>
    </div>
  }
</div>

<!-- Active Tab Content -->
@if (activeTab() === 'characters') {
  <app-people-list />
} @else {
  <div class="max-w-7xl mx-auto px-4 py-8">
    <app-planets-list />
  </div>
}
