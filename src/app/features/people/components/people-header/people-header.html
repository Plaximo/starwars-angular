<header class="mb-6">
  <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
    <div>
      <h1 class="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-amber-300 via-amber-400 to-yellow-500 tracking-wider uppercase">
        {{ i18n.t().headerTitle }}
      </h1>
      <p class="text-sm text-slate-400 mt-1">
        {{ i18n.t().headerSubtitle }}
      </p>
    </div>

    <!-- Count & Filter Reset Badge -->
    <div class="flex items-center gap-3 self-start md:self-auto">
      @if (hasActiveFilters()) {
        <button
          type="button"
          (click)="resetFilters.emit()"
          class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-medium bg-rose-500/10 hover:bg-rose-500/20 text-rose-300 border border-rose-500/30 transition-colors cursor-pointer"
        >
          <span>✕ {{ i18n.t().resetFilters }}</span>
        </button>
      }
      <!-- Split View Mode Button -->
      <a
        [routerLink]="['/people-side-by-side']"
        queryParamsHandling="preserve"
        class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-800 hover:bg-slate-700 text-amber-300 border border-slate-700 hover:border-amber-400/40 shadow-sm transition-all hover:scale-105 cursor-pointer"
        [title]="i18n.t().splitViewBtnTitle"
      >
        <span>◫</span>
        <span>{{ i18n.t().splitView }}</span>
      </a>

      <!-- Create Character Button -->
      <button
        type="button"
        (click)="createClick.emit()"
        class="inline-flex items-center gap-1.5 px-3.5 py-1.5 rounded-lg text-xs font-bold text-slate-950 bg-gradient-to-r from-amber-400 to-yellow-400 hover:from-amber-300 hover:to-yellow-300 shadow-md transition-all hover:scale-105 cursor-pointer"
      >
        <span>+</span>
        <span>{{ i18n.t().newCharacter }}</span>
      </button>
      <span class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-semibold bg-slate-900 border border-slate-700 text-amber-300">
        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
        {{ i18n.t().showingCount(filteredCount(), totalCount()) }}
      </span>
    </div>
  </div>
</header>
