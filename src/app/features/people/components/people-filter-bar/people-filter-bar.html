<div class="mb-8 p-4 rounded-xl bg-slate-900/80 border border-slate-800 shadow-md flex flex-col lg:flex-row items-stretch lg:items-center gap-4">
  
  <!-- 1. Live Search Input -->
  <div class="relative flex-1">
    <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
      </svg>
    </div>
    <input
      type="text"
      placeholder="Search by name (e.g. Luke, Vader, Organa)..."
      [value]="search()"
      (input)="searchChange.emit($any($event.target).value)"
      class="w-full pl-10 pr-9 py-2 bg-slate-950/70 text-slate-100 placeholder-slate-500 text-sm rounded-lg border border-slate-700/80 focus:outline-none focus:border-amber-400 focus:ring-1 focus:ring-amber-400 transition"
    />
    @if (search()) {
      <button
        type="button"
        (click)="searchChange.emit('')"
        class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-200 text-sm cursor-pointer"
      >
        ✕
      </button>
    }
  </div>

  <!-- 2. Gender Filter Dropdown -->
  <div class="flex items-center gap-2">
    <label for="gender-select" class="text-xs font-medium text-slate-400 whitespace-nowrap">Gender:</label>
    <select
      id="gender-select"
      [value]="gender()"
      (change)="genderChange.emit($any($event.target).value)"
      class="bg-slate-950/70 text-slate-200 text-sm rounded-lg border border-slate-700/80 px-3 py-2 focus:outline-none focus:border-amber-400 focus:ring-1 focus:ring-amber-400 transition cursor-pointer"
    >
      <option value="all">All Genders</option>
      <option value="male">Male</option>
      <option value="female">Female</option>
      <option value="n/a">Droid / N/A</option>
      <option value="hermaphrodite">Hermaphrodite</option>
      <option value="other">Other</option>
    </select>
  </div>

  <!-- 3. Sort Field Dropdown -->
  <div class="flex items-center gap-2">
    <label for="sort-select" class="text-xs font-medium text-slate-400 whitespace-nowrap">Sort by:</label>
    <select
      id="sort-select"
      [value]="sortBy()"
      (change)="sortByChange.emit($any($event.target).value)"
      class="bg-slate-950/70 text-slate-200 text-sm rounded-lg border border-slate-700/80 px-3 py-2 focus:outline-none focus:border-amber-400 focus:ring-1 focus:ring-amber-400 transition cursor-pointer"
    >
      <option value="name">Name (A-Z)</option>
      <option value="height">Height</option>
      <option value="mass">Mass / Weight</option>
      <option value="birthYear">Birth Year</option>
    </select>

    <!-- 4. Sort Direction Toggle Button -->
    <button
      type="button"
      (click)="sortDirToggle.emit()"
      title="Toggle sort direction"
      class="inline-flex items-center justify-center p-2 rounded-lg bg-slate-950/70 border border-slate-700/80 text-amber-300 hover:text-amber-200 hover:border-amber-400/50 transition cursor-pointer"
    >
      @if (sortDir() === 'asc') {
        <span class="text-xs font-bold flex items-center gap-1">▲ ASC</span>
      } @else {
        <span class="text-xs font-bold flex items-center gap-1">▼ DESC</span>
      }
    </button>
  </div>

</div>
