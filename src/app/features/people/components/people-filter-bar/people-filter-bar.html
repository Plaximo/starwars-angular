<div class="mb-8 p-4 rounded-xl bg-slate-900/80 border border-slate-800 shadow-md flex flex-col lg:flex-row items-stretch lg:items-center gap-4">
  
  <!-- 1. Live Search Input -->
  <div class="relative flex-1">
    <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
      </svg>
    </div>
    <input
      type="text"
      [placeholder]="i18n.t().searchPlaceholder"
      [value]="search()"
      (input)="searchChange.emit($any($event.target).value)"
      class="w-full pl-10 pr-9 py-2 bg-slate-950/70 text-slate-100 placeholder-slate-500 text-sm rounded-lg border border-slate-700/80 focus:outline-none focus:border-amber-400 focus:ring-1 focus:ring-amber-400 transition"
    />
    @if (search()) {
      <button
        type="button"
        (click)="searchChange.emit('')"
        class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-200 text-sm cursor-pointer"
      >
        ✕
      </button>
    }
  </div>

  <!-- Bookmarks Quick Toggle Segment -->
  <div class="flex items-center p-0.5 rounded-lg bg-slate-950 border border-slate-700/80 shrink-0">
    <button
      type="button"
      (click)="onlyBookmarkedChange.emit(false)"
      [class.bg-slate-800]="!onlyBookmarked()"
      [class.text-white]="!onlyBookmarked()"
      [class.text-slate-400]="onlyBookmarked()"
      class="px-2.5 py-1.5 rounded-md text-xs font-medium transition cursor-pointer"
    >
      {{ i18n.t().filterAll }}
    </button>
    <button
      type="button"
      (click)="onlyBookmarkedChange.emit(true)"
      [class.bg-amber-400/20]="onlyBookmarked()"
      [class.text-amber-300]="onlyBookmarked()"
      [class.border]="onlyBookmarked()"
      [class.border-amber-400/40]="onlyBookmarked()"
      [class.text-slate-400]="!onlyBookmarked()"
      class="px-2.5 py-1.5 rounded-md text-xs font-medium transition flex items-center gap-1 cursor-pointer"
      [title]="i18n.t().savedBadge"
    >
      <span>⭐</span>
      <span>{{ i18n.t().savedBadge }}</span>
      <span class="px-1.5 py-0.5 rounded text-[10px] bg-slate-900 border border-slate-700 font-semibold text-amber-300">
        {{ bookmarkedCount() }}
      </span>
    </button>
  </div>

  <!-- 2. Gender Filter Dropdown -->
  <div class="flex items-center gap-2">
    <label for="gender-select" class="text-xs font-medium text-slate-400 whitespace-nowrap">{{ i18n.t().labelGender }}</label>
    <select
      id="gender-select"
      [value]="gender()"
      (change)="genderChange.emit($any($event.target).value)"
      class="bg-slate-950/70 text-slate-200 text-sm rounded-lg border border-slate-700/80 px-3 py-2 focus:outline-none focus:border-amber-400 focus:ring-1 focus:ring-amber-400 transition cursor-pointer"
    >
      <option value="all">{{ i18n.t().genderAll }}</option>
      <option value="male">{{ i18n.t().genderMale }}</option>
      <option value="female">{{ i18n.t().genderFemale }}</option>
      <option value="n/a">{{ i18n.t().genderDroid }}</option>
      <option value="hermaphrodite">{{ i18n.t().genderHermaphrodite }}</option>
      <option value="other">{{ i18n.t().genderOther }}</option>
    </select>
  </div>

  <!-- 3. Sort Field Dropdown -->
  <div class="flex items-center gap-2">
    <label for="sort-select" class="text-xs font-medium text-slate-400 whitespace-nowrap">{{ i18n.t().labelSortBy }}</label>
    <select
      id="sort-select"
      [value]="sortBy()"
      (change)="sortByChange.emit($any($event.target).value)"
      class="bg-slate-950/70 text-slate-200 text-sm rounded-lg border border-slate-700/80 px-3 py-2 focus:outline-none focus:border-amber-400 focus:ring-1 focus:ring-amber-400 transition cursor-pointer"
    >
      <option value="name">{{ i18n.t().sortByName }}</option>
      <option value="height">{{ i18n.t().sortByHeight }}</option>
      <option value="mass">{{ i18n.t().sortByMass }}</option>
      <option value="birthYear">{{ i18n.t().sortByBirthYear }}</option>
    </select>

    <!-- 4. Sort Direction Toggle Button -->
    <button
      type="button"
      (click)="sortDirToggle.emit()"
      title="Toggle sort direction"
      class="inline-flex items-center justify-center p-2 rounded-lg bg-slate-950/70 border border-slate-700/80 text-amber-300 hover:text-amber-200 hover:border-amber-400/50 transition cursor-pointer"
    >
      @if (sortDir() === 'asc') {
        <span class="text-xs font-bold flex items-center gap-1">{{ i18n.t().sortAsc }}</span>
      } @else {
        <span class="text-xs font-bold flex items-center gap-1">{{ i18n.t().sortDesc }}</span>
      }
    </button>
  </div>

</div>
