@if (isOpen()) {
  <div
    class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4 overflow-y-auto"
    (click)="close.emit()"
  >
    <!-- Modal Dialog Window -->
    <div
      class="relative w-full max-w-lg bg-slate-900 border border-slate-700/80 rounded-2xl shadow-2xl p-6 sm:p-8 space-y-6 text-slate-100 glow-accent"
      (click)="$event.stopPropagation()"
    >
      <!-- Header -->
      <div class="flex items-start justify-between gap-4 border-b border-slate-800 pb-4">
        <div>
          <h2 class="text-xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-amber-300 via-amber-400 to-yellow-500">
            {{ person() ? i18n.t().editModalTitle : i18n.t().createModalTitle }}
          </h2>
          <p class="text-xs text-slate-400 mt-1">
            {{ person() ? i18n.t().editModalDesc(person()!.id) : i18n.t().createModalDesc }}
          </p>
        </div>
        <button
          type="button"
          (click)="close.emit()"
          class="text-slate-400 hover:text-white text-lg p-1 transition cursor-pointer"
        >
          ✕
        </button>
      </div>

      <!-- Error Alert -->
      @if (errorMessage()) {
        <div class="p-3 rounded-lg bg-rose-500/10 border border-rose-500/30 text-rose-300 text-xs flex items-center gap-2">
          <span>⚠️</span>
          <span>{{ errorMessage() }}</span>
        </div>
      }

      <!-- Form Inputs Grid -->
      <form (submit)="$event.preventDefault(); onSubmit()" class="space-y-4">
        
        <!-- Name -->
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-1">
            {{ i18n.t().formName }} <span class="text-amber-400">*</span>
          </label>
          <input
            type="text"
            required
            placeholder="e.g. Mara Jade, Revan, Din Djarin"
            [value]="name()"
            (input)="name.set($any($event.target).value)"
            class="w-full px-3.5 py-2 bg-slate-950/70 border border-slate-700 rounded-lg text-sm text-white placeholder-slate-500 focus:outline-none focus:border-amber-400 focus:ring-1 focus:ring-amber-400 transition"
          />
        </div>

        <div class="grid grid-cols-2 gap-4">
          <!-- Gender -->
          <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-1">{{ i18n.t().formGender }}</label>
            <select
              [value]="gender()"
              (change)="gender.set($any($event.target).value)"
              class="w-full px-3.5 py-2 bg-slate-950/70 border border-slate-700 rounded-lg text-sm text-white focus:outline-none focus:border-amber-400 focus:ring-1 focus:ring-amber-400 transition cursor-pointer"
            >
              <option value="male">{{ i18n.t().genderMale }}</option>
              <option value="female">{{ i18n.t().genderFemale }}</option>
              <option value="n/a">{{ i18n.t().genderDroid }}</option>
              <option value="hermaphrodite">{{ i18n.t().genderHermaphrodite }}</option>
              <option value="other">{{ i18n.t().genderOther }}</option>
            </select>
          </div>

          <!-- Birth Year -->
          <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-1">{{ i18n.t().formBirthYear }}</label>
            <input
              type="text"
              placeholder="e.g. 19BBY"
              [value]="birthYear()"
              (input)="birthYear.set($any($event.target).value)"
              class="w-full px-3.5 py-2 bg-slate-950/70 border border-slate-700 rounded-lg text-sm text-white placeholder-slate-500 focus:outline-none focus:border-amber-400 focus:ring-1 focus:ring-amber-400 transition"
            />
          </div>
        </div>

        <div class="grid grid-cols-2 gap-4">
          <!-- Height -->
          <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-1">{{ i18n.t().formHeight }}</label>
            <input
              type="number"
              placeholder="e.g. 180"
              [value]="heightRaw()"
              (input)="heightRaw.set($any($event.target).value)"
              class="w-full px-3.5 py-2 bg-slate-950/70 border border-slate-700 rounded-lg text-sm text-white placeholder-slate-500 focus:outline-none focus:border-amber-400 focus:ring-1 focus:ring-amber-400 transition"
            />
          </div>

          <!-- Mass -->
          <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-1">{{ i18n.t().formMass }}</label>
            <input
              type="number"
              placeholder="e.g. 75"
              [value]="massRaw()"
              (input)="massRaw.set($any($event.target).value)"
              class="w-full px-3.5 py-2 bg-slate-950/70 border border-slate-700 rounded-lg text-sm text-white placeholder-slate-500 focus:outline-none focus:border-amber-400 focus:ring-1 focus:ring-amber-400 transition"
            />
          </div>
        </div>

        <div class="grid grid-cols-3 gap-3">
          <!-- Eye Color -->
          <div>
            <label class="block text-[10px] font-semibold uppercase tracking-wider text-slate-400 mb-1">{{ i18n.t().formEyeColor }}</label>
            <input
              type="text"
              placeholder="blue, red"
              [value]="eyeColor()"
              (input)="eyeColor.set($any($event.target).value)"
              class="w-full px-2.5 py-1.5 bg-slate-950/70 border border-slate-700 rounded-lg text-xs text-white focus:outline-none focus:border-amber-400"
            />
          </div>

          <!-- Hair Color -->
          <div>
            <label class="block text-[10px] font-semibold uppercase tracking-wider text-slate-400 mb-1">{{ i18n.t().formHairColor }}</label>
            <input
              type="text"
              placeholder="black, blond"
              [value]="hairColor()"
              (input)="hairColor.set($any($event.target).value)"
              class="w-full px-2.5 py-1.5 bg-slate-950/70 border border-slate-700 rounded-lg text-xs text-white focus:outline-none focus:border-amber-400"
            />
          </div>

          <!-- Skin Color -->
          <div>
            <label class="block text-[10px] font-semibold uppercase tracking-wider text-slate-400 mb-1">{{ i18n.t().formSkinColor }}</label>
            <input
              type="text"
              placeholder="fair, green"
              [value]="skinColor()"
              (input)="skinColor.set($any($event.target).value)"
              class="w-full px-2.5 py-1.5 bg-slate-950/70 border border-slate-700 rounded-lg text-xs text-white focus:outline-none focus:border-amber-400"
            />
          </div>
        </div>

        <!-- Action Buttons -->
        <div class="pt-4 border-t border-slate-800 flex items-center justify-end gap-3">
          <button
            type="button"
            (click)="close.emit()"
            class="px-4 py-2 rounded-lg text-sm font-medium text-slate-300 hover:text-white bg-slate-800 hover:bg-slate-700 transition cursor-pointer"
          >
            {{ i18n.t().formCancel }}
          </button>
          <button
            type="submit"
            class="px-5 py-2 rounded-lg text-sm font-bold text-slate-950 bg-gradient-to-r from-amber-400 to-yellow-400 hover:from-amber-300 hover:to-yellow-300 shadow-md transition cursor-pointer"
          >
            {{ person() ? i18n.t().formSave : i18n.t().formCreate }}
          </button>
        </div>

      </form>
    </div>
  </div>
}
